name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m compileall -q src tests
      - run: python -m pip wheel --no-deps . -w dist
      - run: python -m pip install --force-reinstall dist/qmt_execution_core-*.whl
      - run: cd /tmp && qmt-execution-core verify

  windows-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Windows mutex, coordination and session-lease probes
        run: >-
          python -m pytest
          tests/test_journal_mutex.py
          tests/test_coordination.py
          tests/test_coordinated_session.py
          tests/test_shared_runtime.py
      - run: python -m compileall -q src tests
